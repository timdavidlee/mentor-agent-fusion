[project]
name = "mentor-agent-fusion"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.1",
    "langchain>=1.5.2",
    "langgraph>=1.2.24",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "typer>=0.29.2",
]

[project.scripts]
dealer-gen = "generator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datasets/generator", "datasets/query_engine"]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"datasets/generator/schema/tables.py" = ["E501"]  # column comments copied from schema.sql

[tool.ruff.lint.isort]
known-first-party = ["generator"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["datasets/tests"]
